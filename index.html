<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QRCODE AM | Advance Maker</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script type="text/javascript" src="https://unpkg.com/qr-code-styling@1.5.0/lib/qr-code-styling.js"></script>
</head>
<body>
    <div class="page-wrapper">
        <header class="top-header">
            <div class="header-content">
                <h1 class="brand-title">QRCODE <span>AM</span></h1>
                <p class="brand-subtitle">Advance Maker - أداة متقدمة لتوليد وتخصيص رموز الاستجابة السريعة بدقة عالية</p>
            </div>
        </header>

        <main class="main-container">
            <!-- لوحة الإعدادات -->
            <div class="settings-panel">
                <div class="card">
                    <div class="form-group">
                        <label>الرابط أو النص</label>
                        <input type="text" id="urlInput" class="input-text" placeholder="https://example.com" value="https://example.com">
                    </div>

                    <div class="form-row">
                        <div class="form-group half">
                            <label>لون الرمز</label>
                            <div class="color-input-wrapper">
                                <input type="color" id="fgColor" value="#000000">
                                <span class="color-hex">#000000</span>
                            </div>
                        </div>
                        <div class="form-group half">
                            <label>لون الخلفية</label>
                            <div class="color-input-wrapper">
                                <input type="color" id="bgColor" value="#ffffff">
                                <span class="color-hex">#ffffff</span>
                            </div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>شكل التصميم (النقاط)</label>
                        <select id="dotStyle" class="input-select">
                            <option value="square">كلاسيكي (مربعات)</option>
                            <option value="rounded">حواف ناعمة</option>
                            <option value="extra-rounded">دائري كامل</option>
                            <option value="dots">نقاط منفصلة</option>
                            <option value="classy">عصري متصل (Classy)</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>شعار الـ QR Code</label>
                        <label class="file-upload-btn">
                            <input type="file" id="logoInput" accept="image/*">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                            <span id="fileName">تصفح لرفع شعار...</span>
                        </label>
                        <button id="removeLogo" class="btn-text-danger" style="display: none;">إزالة الشعار</button>
                    </div>
                </div>

                <!-- الإعدادات المتقدمة -->
                <div class="card advanced-card">
                    <button id="toggleAdvanced" class="advanced-header">
                        <div class="advanced-title">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
                            إعدادات التصدير المتقدمة
                        </div>
                        <svg class="chevron-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"></polyline></svg>
                    </button>
                    
                    <div id="advancedSettings" class="advanced-body">
                        <div class="form-row">
                            <div class="form-group half">
                                <label>العرض (بكسل)</label>
                                <input type="number" id="qrWidth" class="input-text" value="2048" step="256" min="256" max="4096">
                            </div>
                            <div class="form-group half">
                                <label>الطول (بكسل)</label>
                                <input type="number" id="qrHeight" class="input-text" value="2048" step="256" min="256" max="4096">
                            </div>
                        </div>
                        <div class="form-group">
                            <label>مستوى تصحيح الأخطاء</label>
                            <select id="errorCorrection" class="input-select">
                                <option value="H">عالي جداً (30%) - الأفضل للشعارات</option>
                                <option value="Q">عالي (25%)</option>
                                <option value="M">متوسط (15%)</option>
                                <option value="L">منخفض (7%)</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>

            <!-- لوحة المعاينة -->
            <div class="preview-panel">
                <div class="preview-sticky">
                    <h3 class="preview-title">المعاينة المباشرة</h3>
                    <div class="qr-preview-box">
                        <div id="canvas"></div>
                    </div>
                    <button id="downloadBtn" class="btn-primary">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                        تحميل الصورة بجودة عالية
                    </button>
                </div>
            </div>
        </main>

        <footer class="site-footer">
            <div class="footer-content">
                <a href="https://github.com/Turki-Alshaikh" target="_blank" class="github-badge">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/></svg>
                    <span>Turki-Alshaikh</span>
                </a>
                <div class="sponsor-badge">
                    <span class="sponsor-label">الراعي الرسمي</span>
                    <a href="https://mfatihy.com" target="_blank" class="sponsor-link">
                        <img src="Logo.png" alt="الراعي الرسمي" onerror="this.style.display='none'; this.nextElementSibling.style.display='inline';">
                        <span style="display:none; font-weight: 700; color: #334155;">مفاتيحي</span>
                    </a>
                </div>
            </div>
        </footer>
    </div>
    <script src="script.js"></script>
</body>
</html>
